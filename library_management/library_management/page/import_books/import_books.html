<!-- library_management/library_management/page/import_books/import_books.html -->
<div class="page-form flex">
    <div class="form-dashboard" style="width: 100%">
        <div class="frappe-card">
            <div class="frappe-card-head">
                <h3>Import Books from Frappe Library API</h3>
            </div>
            <div class="frappe-card-body" style="padding: 0 15px 0 15px;">
                <form >
                    <div class="row">
                        <div class="form-group col-md-4">
                            <label for="number_of_books">Number of Books to Import:</label>
                            <input type="number" class="form-control" id="number_of_books" min="1" max="100" value="20">
                            <small class="form-text text-muted">Maximum 100 books at once</small>
                        </div>
                        <div class="form-group col-md-4">
                            <label for="title">Book Title (Optional):</label>
                            <input type="text" class="form-control" id="title" placeholder="e.g. Harry Potter">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="authors">Author(s) (Optional):</label>
                            <input type="text" class="form-control" id="authors" placeholder="e.g. J.K. Rowling">
                        </div>
                    </div>
                    <div class="row">
                        <div class="form-group col-md-4">
                            <label for="isbn">ISBN (Optional):</label>
                            <input type="text" class="form-control" id="isbn" placeholder="e.g. 9780747532743">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="publisher">Publisher (Optional):</label>
                            <input type="text" class="form-control" id="publisher" placeholder="e.g. Bloomsbury">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="starting_page">Starting Page (Optional):</label>
                            <input type="number" class="form-control" id="starting_page" min="1" value="1">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12 mt-4 pl-0 mb-2">
                            <button type="button" id="import_books_btn" class="btn btn-primary">Import Books</button>
                        </div>
                    </div>
                </form>
                <div class="import-results mt-4" style="display: none;">
                    <h4>Import Results</h4>
                    <div class="alert alert-info">
                        <span id="import_status">Processing...</span>
                    </div>
                    <div class="progress">
                        <div id="import_progress" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
                    </div>
                    <div id="books_list" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>
